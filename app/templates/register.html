{% extends "base.html" %}

{% block title %}Create Account - SwiftLink{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 480px; margin: 3rem auto;">
  <h2 style="text-align: center; margin-bottom: 0.5rem;">Create Your Account</h2>
  <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Get access to private analytics, API keys, and link management.</p>

  <form method="POST" action="{{ url_for('auth.register') }}">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="john_doe" required autofocus>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
    </div>

    <button type="submit" class="btn btn-primary" id="register-submit-btn" style="width: 100%; margin-top: 1rem;">Create Account</button>
  </form>

  <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
    Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--accent-primary);">Log in here</a>
  </p>
</div>
{% endblock %}
