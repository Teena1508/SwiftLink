{% extends "base.html" %}

{% block title %}Login - SwiftLink{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 450px; margin: 3rem auto;">
  <h2 style="text-align: center; margin-bottom: 0.5rem;">Welcome Back</h2>
  <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Log in to manage your shortened links & API keys.</p>

  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="form-group">
      <label for="username">Username or Email</label>
      <input type="text" id="username" name="username" class="form-control" required autofocus>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width: 100%; margin-top: 1rem;">Log In</button>
  </form>

  <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
    Don't have an account? <a href="{{ url_for('auth.register') }}" style="color: var(--accent-primary);">Register here</a>
  </p>
</div>
{% endblock %}
